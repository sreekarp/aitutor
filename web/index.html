<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tutor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css"
        integrity="sha384-lPx0C4zIUZLpveABMwOFcFeGZwsvKBJfhJ85FN1PYOV7xApBcFMhcAEMVKF8loOI" crossorigin="anonymous">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"
          integrity="sha384-19KE2cFb3U+RUWmyhBz7aLOGDG8WrRC6hE3oY/HTZZlAAVWYTdmvLC//+TIV3zUx" crossorigin="anonymous"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <section id="signin" class="card" hidden>
    <h1>Quadratic equations</h1>
    <p class="hint">NCERT Class 10, chapter 4. Sign in to start or carry on.</p>
    <form id="signin-form">
      <label>Username
        <input name="username" required maxlength="30" pattern="[A-Za-z0-9_.\-]+" autocomplete="username"
               title="Letters, digits, _ . or - (up to 30)">
      </label>
      <label>First name <input name="first_name" required maxlength="30" autocomplete="given-name"></label>
      <label>Access code <input name="access_code" type="password" required autocomplete="off"></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="signin-error" class="error" role="alert"></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <strong>Quadratic equations</strong>
      <span id="concept" class="concept"></span>
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <button id="signout" type="button">Sign out</button>
    </header>
    <main class="layout">
      <section class="board-area" aria-label="Whiteboard">
        <div id="board" class="board"></div>
        <button id="start" type="button" class="primary start">Start</button>
      </section>
      <section class="talk" aria-label="Conversation">
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="say-form" class="say" hidden>
          <button id="mic" type="button" aria-pressed="false">🎤 Speak</button>
          <input id="text-box" aria-label="Your answer or question" maxlength="500" autocomplete="off"
                 placeholder="Type your answer or question">
          <button id="send" type="submit" class="primary">Send</button>
        </form>
        <p id="mic-note" class="hint" hidden>The microphone needs https (or localhost), so please type your answers.</p>
      </section>
      <aside class="side">
        <section class="panel" aria-label="Progress">
          <h2>Progress</h2>
          <ol id="progress" class="progress"></ol>
        </section>
        <section class="panel" aria-label="Why the tutor decided">
          <h2>Why?</h2>
          <ol id="why" class="why"></ol>
        </section>
      </aside>
    </main>
  </div>
</body>
</html>
