# Concept 3. Our own variants of NCERT 4.3 (Examples 3-6). Every answer key is computed by SymPy.
# Mistake fixes and the reteach step (zero_product) use numbers that answer no check in this file.
id: factorisation
title: Solving by factorisation
ncert: "4.3, Examples 3–6"
intro: "Factorising lets us find the roots ourselves: we write the quadratic as two brackets multiplied together, and each bracket gives a root. It's often the quickest way to solve."
aliases: [factorisation, factorization, factorising, factorizing, factoring]

steps:
  - id: zero_product
    segments:
      - say: "If two numbers multiply to give zero, at least one of them must be zero. Look at this equation."
        board:
          - {op: write, id: zp1, latex: '(x-4)(x+1) = 0', check: "Eq((x-4)*(x+1), 0)"}
      - say: "So either this bracket is zero,"
        board:
          - {op: highlight, target: zp1, part: '(x-4)'}
      - say: "or that one is. The first bracket gives x equals 4, and the second gives x equals minus 1."
        board:
          - {op: highlight, target: zp1, part: '(x+1)'}
          - {op: write, id: zp2, latex: 'x = 4 \text{ or } x = -1', check: "Or(Eq(x, 4), Eq(x, -1))"}

  - id: split_middle
    segments:
      - say: "To factorise x squared minus 7x plus 12, look for two numbers that multiply to 12 and add to minus 7. Minus 3 and minus 4 work."
        board:
          - {op: write, id: sp1, latex: 'x^2 - 7x + 12', check: "x**2 - 7*x + 12"}
      - say: "Use them to split the middle term. Then take out a common factor from each pair."
        board:
          - {op: write, id: sp2, latex: 'x^2 - 3x - 4x + 12', check: "x**2 - 3*x - 4*x + 12"}
          - {op: highlight, target: sp2, part: '- 3x - 4x'}
          - {op: write, id: sp3, latex: 'x(x-3) - 4(x-3)', check: "x*(x-3) - 4*(x-3)"}
      - say: "Both parts share x minus 3, so it comes out as a bracket. Now it's two brackets multiplied together."
        board:
          - {op: write, id: sp4, latex: '(x-3)(x-4)', check: "(x-3)*(x-4)"}

  - id: a_not_one
    segments:
      - say: "When the x squared term has a number in front, multiply a by c first: the number in front of x squared, times the number with no x. For 2x squared minus 5x plus 3, that's 2 times 3, which is 6."
        board:
          - {op: write, id: an1, latex: '2x^2 - 5x + 3 = 0', check: "Eq(2*x**2 - 5*x + 3, 0)"}
      - say: "Two numbers that multiply to 6 and add to minus 5 are minus 2 and minus 3. Split the middle term, then take out the common factors."
        board:
          - {op: write, id: an2, latex: '2x^2 - 2x - 3x + 3 = 0', check: "Eq(2*x**2 - 2*x - 3*x + 3, 0)"}
          - {op: write, id: an3, latex: '2x(x-1) - 3(x-1) = 0', check: "Eq(2*x*(x-1) - 3*(x-1), 0)"}
      - say: "x minus 1 is common, so we get 2x minus 3, times x minus 1. Setting each bracket to zero gives x equals 3 over 2, or x equals 1."
        board:
          - {op: write, id: an4, latex: '(2x-3)(x-1) = 0', check: "Eq((2*x-3)*(x-1), 0)"}
          - {op: write, id: an5, latex: 'x = \frac{3}{2} \text{ or } x = 1', check: "Or(Eq(x, 3/2), Eq(x, 1))"}

  - id: zero_on_one_side
    segments:
      - say: "The zero product rule only works when one side is zero. In x squared plus 2x equals 8, move the 8 to the left first. Its sign changes as it moves."
        board:
          - {op: write, id: zs1, latex: 'x^2 + 2x = 8', check: "Eq(x**2 + 2*x, 8)"}
          - {op: write, id: zs2, latex: 'x^2 + 2x - 8 = 0', check: "Eq(x**2 + 2*x - 8, 0)"}
      - say: "Now factorise. Plus 4 and minus 2 multiply to minus 8 and add to 2."
        board:
          - {op: write, id: zs3, latex: '(x+4)(x-2) = 0', check: "Eq((x+4)*(x-2), 0)"}
      - say: "So x equals minus 4 or x equals 2. Factorising before moving the 8 doesn't help, because the brackets would multiply to 8, not to zero."
        board:
          - {op: write, id: zs4, latex: 'x = -4 \text{ or } x = 2', check: "Or(Eq(x, -4), Eq(x, 2))"}

checks:
  - id: fa1
    say: "Solve x squared minus 5x plus 6 equals zero, and tell me how you got it."
    label: "Solve:"
    equation: "Eq(x**2 - 5*x + 6, 0)"
    kind: roots
    hints:
      - "Can you write the left side as two brackets multiplied together?"
      - "Find two numbers that multiply to 6 and add to minus 5."
      - "Minus 2 and minus 3 work, so it becomes x minus 2, times x minus 3, equals zero."
    traps: {sign_flip: "-2, -3"}

  - id: fa2
    say: "Solve 3x squared minus 5x minus 2 equals zero by factorising. Tell me how you got it."
    label: "Solve by factorising:"
    equation: "Eq(3*x**2 - 5*x - 2, 0)"
    kind: roots
    hints:
      - "Here a is 3 and c is minus 2, the number with no x. Start by multiplying a times c."
      - "You need two numbers that multiply to minus 6 and add to minus 5. Use them to split the middle term."
      - "Minus 6 and plus 1 work: 3x squared minus 6x plus x minus 2 equals zero. Now take out a common factor from each pair."
    traps: {sign_flip: "1/3, -2"}

  - id: fa3
    say: "Solve x minus 2, times x plus 3, equals zero. Tell me how you got it."
    label: "Solve:"
    equation: "Eq((x-2)*(x+3), 0)"
    kind: roots
    hints:
      - "It's already two brackets multiplied together, with zero on the right."
      - "If two things multiply to zero, one of them must be zero. So set each bracket equal to zero."
      - "x minus 2 equals zero is one small equation, and x plus 3 equals zero is the other. Solve each one."
    traps: {sign_flip: "-2, 3"}

  - id: fa4
    say: "Solve x squared plus x minus 12 equals zero. Tell me how you got it."
    label: "Solve:"
    equation: "Eq(x**2 + x - 12, 0)"
    kind: roots
    hints:
      - "Try writing the left side as two brackets multiplied together."
      - "Look for two numbers that multiply to minus 12 and add to plus 1."
      - "Plus 4 and minus 3 work, so it becomes x plus 4, times x minus 3, equals zero."
    traps: {sign_flip: "4, -3"}

  - id: fa5
    say: "Solve x squared minus 5x equals 14. Tell me how you got it."
    label: "Solve:"
    equation: "Eq(x**2 - 5*x, 14)"
    kind: roots
    hints:
      - "Is one side zero? Factorising only helps when it is."
      - "Move the 14 to the left side first. Its sign changes as it moves."
      - "Now you have x squared minus 5x minus 14 equals zero. Find two numbers that multiply to minus 14 and add to minus 5."
    traps: {not_zero_first: "14, 19"}

  - id: fa6
    say: "Solve x squared equals 3x. Tell me how you got it."
    label: "Solve:"
    equation: "Eq(x**2, 3*x)"
    kind: roots
    hints:
      - "Is one side zero? Bring every term to the left first."
      - "Don't divide by x, because x itself could be zero. Take x out as a common factor instead."
      - "x squared minus 3x equals zero becomes x times x minus 3 equals zero. Now set each factor to zero."
    traps: {divided_by_x: "3"}

  - id: fa7
    say: "Solve 2x squared minus 7x plus 3 equals zero by factorising. Tell me how you got it."
    label: "Solve by factorising:"
    equation: "Eq(2*x**2 - 7*x + 3, 0)"
    kind: roots
    hints:
      - "The x squared term has a 2 in front, so multiply 2 by 3 first."
      - "Find two numbers that multiply to 6 and add to minus 7, and use them to split the middle term."
      - "Minus 6 and minus 1 work: 2x squared minus 6x minus x plus 3 equals zero. Take out a common factor from each pair."
    traps: {sign_flip: "-1/2, -3"}

mistakes:
  - id: sign_flip
    looks_like: "roots with the wrong signs, from brackets with the wrong signs or from reading a bracket wrongly, e.g. (x-5)(x+6) = 0 read as x = -5 or 6"
    fix: "Multiply your brackets back out to check them, then set each bracket to zero: x minus 5 equals zero means x is plus 5."
  - id: not_zero_first
    looks_like: "factorises before one side is zero, e.g. x(x+1) = 30 read as x = 30 or x + 1 = 30"
    fix: "Factorising only helps when one side is zero. Move every term to one side first, then factorise."
  - id: wrong_split
    looks_like: "splits the middle term with two numbers that multiply to c instead of a times c, when a is not 1"
    fix: "When a isn't 1, multiply a by c first. The two numbers must multiply to a times c and add to the middle number."
  - id: divided_by_x
    looks_like: "divides both sides by x and loses the root x = 0"
    fix: "Never divide by x, because x might be zero. Bring every term to one side and take x out as a common factor instead."

strategies: [worked_example, substitute_back, compare_non_example]
reteach_step: zero_product
