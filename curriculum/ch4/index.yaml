# NCERT Class 10, Chapter 4: Quadratic Equations. The lessons, in teaching order.
# Each lesson's aliases are the names a student can say to go to it ("Can we skip to the factorization topic?").
version: "2026.10.5"

order:
  - standard_form
  - roots
  - factorisation
  - quadratic_formula
  - discriminant
  - word_problems

# The 4 general formulas, written by hand. SymPy can't check them (they use the letters a, b, c and D),
# so a lesson places them by name: {op: write, id: ..., formula: quadratic_formula}.
# LaTeX is in single quotes so YAML keeps every backslash.
formulas:
  standard_form: 'ax^{2} + bx + c = 0, \quad a \neq 0'
  quadratic_formula: 'x = \frac{-b \pm \sqrt{b^{2} - 4ac}}{2a}'
  discriminant: 'D = b^{2} - 4ac'
  nature_cases: '\begin{aligned} D > 0 &: \text{two distinct real roots} \\ D = 0 &: \text{two equal real roots} \\ D < 0 &: \text{no real roots} \end{aligned}'

# Equations RESPOND may use for a new example (a solved example, a reteach, an explanation). None is a lesson
# question or has all its roots in one, so solving it never gives an answer away. Checked at startup: the LaTeX
# says the same as the check, it is a quadratic, and its real roots are the ones listed (one: equal roots; none:
# no real roots). Each turn RESPOND gets only those sharing no root with the answer it must not give away.
examples:
  - {latex: 'x^2 - 9x + 20 = 0', check: "Eq(x**2 - 9*x + 20, 0)", roots: ["4", "5"]}
  - {latex: 'x^2 + 5x + 4 = 0', check: "Eq(x**2 + 5*x + 4, 0)", roots: ["-4", "-1"]}
  - {latex: 'x^2 - 2x - 8 = 0', check: "Eq(x**2 - 2*x - 8, 0)", roots: ["-2", "4"]}
  - {latex: 'x^2 - 8x + 7 = 0', check: "Eq(x**2 - 8*x + 7, 0)", roots: ["1", "7"]}
  - {latex: 'x^2 + 9x + 18 = 0', check: "Eq(x**2 + 9*x + 18, 0)", roots: ["-6", "-3"]}
  - {latex: 'x^2 + 6x + 8 = 0', check: "Eq(x**2 + 6*x + 8, 0)", roots: ["-4", "-2"]}
  - {latex: '2x^2 - 7x + 6 = 0', check: "Eq(2*x**2 - 7*x + 6, 0)", roots: ["3/2", "2"]}
  - {latex: '3x^2 - 7x + 2 = 0', check: "Eq(3*x**2 - 7*x + 2, 0)", roots: ["1/3", "2"]}
  - {latex: '2x^2 + 5x + 2 = 0', check: "Eq(2*x**2 + 5*x + 2, 0)", roots: ["-2", "-1/2"]}
  - {latex: '3x^2 + 4x - 4 = 0', check: "Eq(3*x**2 + 4*x - 4, 0)", roots: ["-2", "2/3"]}
  - {latex: 'x^2 - 6x + 4 = 0', check: "Eq(x**2 - 6*x + 4, 0)", roots: ["3 - sqrt(5)", "3 + sqrt(5)"]}
  - {latex: 'x^2 + 2x - 4 = 0', check: "Eq(x**2 + 2*x - 4, 0)", roots: ["-1 - sqrt(5)", "-1 + sqrt(5)"]}
  - {latex: '2x^2 - 4x - 1 = 0', check: "Eq(2*x**2 - 4*x - 1, 0)", roots: ["1 - sqrt(6)/2", "1 + sqrt(6)/2"]}
  - {latex: 'x^2 + 12x + 36 = 0', check: "Eq(x**2 + 12*x + 36, 0)", roots: ["-6"]}
  - {latex: '9x^2 + 12x + 4 = 0', check: "Eq(9*x**2 + 12*x + 4, 0)", roots: ["-2/3"]}
  - {latex: 'x^2 + 2x + 5 = 0', check: "Eq(x**2 + 2*x + 5, 0)", roots: []}
  - {latex: '2x^2 - 3x + 5 = 0', check: "Eq(2*x**2 - 3*x + 5, 0)", roots: []}
