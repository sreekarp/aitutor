# Concept 2. Our own variants of the opening of NCERT 4.3. Every answer key is computed by SymPy.
# Answers here are yes or no, so there are no traps: the LLM spots these mistakes from the working.
id: roots
title: Roots and checking by substitution
ncert: "4.3, opening"
intro: "Solving an equation means finding its roots. We'll learn what a root is, and a quick way to check whether any number is one."

steps:
  - id: definition
    segments:
      - say: "A number is a root of an equation if putting it in place of x makes the equation true. Let's try x equals 1 in this equation."
        board:
          - {op: write, id: rd1, latex: '2x^2 - 3x + 1 = 0', check: "Eq(2*x**2 - 3*x + 1, 0)"}
          - {op: write, id: rd2, latex: '2(1)^2 - 3(1) + 1 = 0', check: "Eq(2*1**2 - 3*1 + 1, 0)"}
      - say: "2 minus 3 plus 1 is zero, so both sides are equal. That means 1 is a root."
        board:
          - {op: highlight, target: rd2, part: '= 0'}

  - id: not_a_root
    segments:
      - say: "Now try x equals 2 in the same equation."
        board:
          - {op: write, id: rd1, latex: '2x^2 - 3x + 1 = 0', check: "Eq(2*x**2 - 3*x + 1, 0)"}
          - {op: write, id: rn1, latex: '2(2)^2 - 3(2) + 1 = 3', check: "Eq(2*2**2 - 3*2 + 1, 3)"}
      - say: "8 minus 6 plus 1 is 3, not zero. The equation isn't true, so 2 is not a root."
        board:
          - {op: highlight, target: rn1, part: '= 3'}

  - id: negative_values
    segments:
      - say: "When you put in a negative number, write it in brackets. Let's try x equals minus 1 in x squared minus 3x minus 4 equals zero."
        board:
          - {op: write, id: nv1, latex: 'x^2 - 3x - 4 = 0', check: "Eq(x**2 - 3*x - 4, 0)"}
          - {op: write, id: nv2, latex: '(-1)^2 - 3(-1) - 4 = 0', check: "Eq((-1)**2 - 3*(-1) - 4, 0)"}
      - say: "Minus 1, squared, is plus 1, because a negative times a negative is positive."
        board:
          - {op: highlight, target: nv2, part: '(-1)^2'}
      - say: "And minus 3 times minus 1 is plus 3. So the left side is 1 plus 3 minus 4, which is zero. Minus 1 is a root."
        board:
          - {op: highlight, target: nv2, part: '3(-1)'}
          - {op: write, id: nv3, latex: '1 + 3 - 4 = 0', check: "Eq(1 + 3 - 4, 0)"}

  - id: at_most_two
    segments:
      - say: "4 is a root of the same equation too: 16 minus 12 minus 4 is zero."
        board:
          - {op: write, id: nv1, latex: 'x^2 - 3x - 4 = 0', check: "Eq(x**2 - 3*x - 4, 0)"}
          - {op: write, id: am1, latex: '4^2 - 3(4) - 4 = 0', check: "Eq(4**2 - 3*4 - 4, 0)"}
      - say: "A quadratic equation has at most two roots. This one has minus 1 and 4, so there are no others to look for."
        board:
          - {op: write, id: am2, text: "A quadratic equation has at most two roots."}

checks:
  - id: rt1
    say: "Is minus 2 a root of x squared plus x minus 2 equals zero? Tell me how you know."
    label: "Is x = -2 a root of:"
    equation: "Eq(x**2 + x - 2, 0)"
    kind: is_root
    candidate: "-2"
    hints:
      - "Put minus 2 in place of every x, in brackets."
      - "Work out minus 2, squared, first. A negative times a negative is positive."
      - "Minus 2, squared, is plus 4. So the left side is 4 minus 2 minus 2. Is that zero?"

  - id: rt2
    say: "Is minus 1 a root of x squared minus 3x plus 2 equals zero? Tell me how you know."
    label: "Is x = -1 a root of:"
    equation: "Eq(x**2 - 3*x + 2, 0)"
    kind: is_root
    candidate: "-1"
    hints:
      - "Put minus 1 in place of every x, in brackets."
      - "Be careful with minus 3 times minus 1. A negative times a negative is positive."
      - "Minus 1, squared, is plus 1, and minus 3 times minus 1 is plus 3. So the left side is 1 plus 3 plus 2. Is that zero?"

  - id: rt3
    say: "Is 3 over 2 a root of 2x squared minus x minus 3 equals zero? Tell me how you know."
    label: "Is x = 3/2 a root of:"
    equation: "Eq(2*x**2 - x - 3, 0)"
    kind: is_root
    candidate: "3/2"
    hints:
      - "Put 3 over 2 in place of every x."
      - "3 over 2, squared, is 9 over 4. Then multiply it by 2."
      - "The left side is 9 over 2, minus 3 over 2, minus 3. Is that zero?"

  - id: rt4
    say: "Is minus 2 a root of x squared plus x plus 6 equals zero? Tell me how you know."
    label: "Is x = -2 a root of:"
    equation: "Eq(x**2 + x + 6, 0)"
    kind: is_root
    candidate: "-2"
    hints:
      - "Put minus 2 in place of every x, in brackets."
      - "Minus 2, squared, is plus 4, because a negative times a negative is positive."
      - "So the left side is 4 minus 2 plus 6. Is that zero?"

  - id: rt5
    say: "Is minus 5 a root of x squared plus 3x minus 10 equals zero? Tell me how you know."
    label: "Is x = -5 a root of:"
    equation: "Eq(x**2 + 3*x - 10, 0)"
    kind: is_root
    candidate: "-5"
    hints:
      - "Put minus 5 in place of every x, in brackets."
      - "Minus 5, squared, is plus 25, and 3 times minus 5 is minus 15."
      - "So the left side is 25 minus 15 minus 10. Is that zero?"

mistakes:
  - id: negative_square
    looks_like: "squares a negative number and gets a negative, e.g. minus 3 squared taken as minus 9"
    fix: "A negative number squared is always positive: minus 3, squared, is minus 3 times minus 3, which is plus 9."
  - id: sign_times_negative
    looks_like: "multiplies two negative numbers and gets a negative, e.g. minus 4 times minus 2 taken as minus 8"
    fix: "A negative times a negative is positive: minus 4 times minus 2 is plus 8. Put a negative value in brackets so you see both signs."

strategies: [worked_example, compare_non_example]
reteach_step: negative_values
